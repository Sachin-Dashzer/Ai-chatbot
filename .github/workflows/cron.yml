# Backup trigger only. vercel.json owns the four daily slots (12:00/16:00/18:00/19:00 IST);
# this exists for the due-time reminders (runDue), which belong to no fixed slot.
# Needs the CRON_URL secret = https://your-domain/api/cron?token=<WA_VERIFY_TOKEN>
# Without it the job is skipped instead of failing, so a missing secret cannot disable the schedule.
name: schedule
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: poke /api/cron
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
        run: |
          if [ -z "$CRON_URL" ]; then
            echo "::warning::CRON_URL secret is not set - skipping. Vercel cron still runs the daily slots."
            exit 0
          fi
          curl -fsS --max-time 60 "$CRON_URL"
